# Continuous Deployment — build and deploy on merge to main
#
# Runs after CI passes. Builds the Docker image, pushes it to GitHub
# Container Registry, and triggers deployment on the target host.
#
# Required repository secrets:
#   DEPLOY_HOST     — SSH host of the deployment target
#   DEPLOY_USER     — SSH user for the deployment target
#   DEPLOY_SSH_KEY  — SSH private key (no passphrase)
#   DEPLOY_DIR      — Directory on target holding docker-compose.yml + .env
#   REGISTRY_USER   — GHCR username (typically the GitHub actor)
#   REGISTRY_TOKEN  — GitHub PAT with `write:packages` (or GITHUB_TOKEN)

name: CD

on:
  push:
    branches: [main]

# A new deploy supersedes an in-flight deploy of the same ref.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to target host
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ always() && needs.build-and-push.result == 'success' }}
    steps:
      - name: Checkout compose file
        uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          DEPLOY_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -e
          eval "$(ssh-agent -s)"
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' | ssh-add -

          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_DIR }} && \
             echo 'DEPLOY_IMAGE=${{ env.DEPLOY_IMAGE }}' > .env.deploy && \
             docker compose pull && \
             docker compose up -d --remove-orphans && \
             docker compose ps"
