# Continuous Deployment — build and deploy on merge to main
#
# Builds the Docker image, pushes it to GitHub Container Registry, and deploys
# to the target host. `main` is protected, so a commit only reaches it after CI
# passed on its pull request.
#
# GHCR authentication uses the workflow's own GITHUB_TOKEN — no PAT secret is
# needed; the `packages: write` permission below is what authorises the push.
#
# Deployment is off unless the repository variable DEPLOY_ENABLED is set to
# 'true'. Without that gate every push to main fails at the SSH step, because
# the build succeeds but no deployment target is configured.
#
# Required repository secrets (only when DEPLOY_ENABLED=true):
#   DEPLOY_HOST     — SSH host of the deployment target
#   DEPLOY_USER     — SSH user for the deployment target
#   DEPLOY_SSH_KEY  — SSH private key (no passphrase)
#   DEPLOY_DIR      — Directory on target holding docker-compose.yml + .env

name: CD

on:
  push:
    branches: [main]

# A new deploy supersedes an in-flight deploy of the same ref.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required to push the image to ghcr.io. The default token scope is read-only.
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    outputs:
      # docker/build-push-action exposes `imageid`, `digest` and `metadata` —
      # never `image`. The deploy needs the exact tag that was pushed, and the
      # metadata step below pins it to the full commit SHA, so it is derived
      # here rather than read from a nonexistent output.
      image: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to target host
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ needs.build-and-push.result == 'success' && vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Checkout compose file
        uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail
          # Secrets are passed through the environment, never interpolated into
          # this script: a `$` or a quote in a secret would otherwise be evaluated
          # by the shell that runs the deploy.
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
          # `printf %q` quotes each value for the *remote* shell. The values are
          # already env-passed, but they are inserted into remote command text,
          # and an apostrophe in DEPLOY_DIR would otherwise close the quoting and
          # break (or rewrite) the command before Compose runs.
          deploy_dir=$(printf '%q' "$DEPLOY_DIR")
          deploy_image=$(printf '%q' "$DEPLOY_IMAGE")
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $deploy_dir && printf 'DEPLOY_IMAGE=%s\n' $deploy_image > .env.deploy && docker compose pull && docker compose up -d --remove-orphans && docker compose ps"
