name: PayStack Integration

# B-67 — the billing feature, gated on its own signal.
#
# This is deliberately narrow. It is not a second full pipeline: the type-check,
# the build and the 230-test suite already run in ci.yml on every push. What
# this adds is a fast, named job that says whether the billing feature
# specifically is green, so a regression in it cannot hide behind a green
# overall run.
#
# Everything here uses scripts that exist in package.json. An earlier revision
# of this file called `npm run test:integration` and `npm run get-paystack-config`,
# neither of which existed — it would have failed on the first push with
# "missing script", which is worse than not existing at all.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same ref. Without this, two
# pushes a minute apart both run to completion and the older (stale) result is
# what the merge gate reads.
concurrency:
  group: paystack-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic, non-secret values. The config module requires 32+ character
  # secrets, so supplying them keeps the build on the real validation path.
  # No PayStack credential is set here: nothing in this flow calls PayStack, so
  # a secret would only be a liability. See the note on logging below.
  SESSION_SECRET: ci-session-secret-not-for-production-use-0000
  ENCRYPTION_KEY: ci-encryption-key-not-for-production-use-000000

jobs:
  paystack-billing:
    name: PayStack billing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      # The build compiles the settings route, the settings repository and the
      # settings page together. That is exactly where B-67 broke: the fields
      # were added to the UserSettings interface and nowhere else, so the row
      # mapper no longer satisfied the type and every build after it failed.
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          DB_CLIENT: sqlite

      # The billing assertions live in the settings service suite alongside the
      # defaults round-trip, the partial-patch rules and per-user isolation, so
      # they are checked against the same table every other setting writes to.
      - name: PayStack settings tests
        run: npx jest lib/services/__tests__/settingsAndAlerts.test.ts --coverage
        env:
          SESSION_SECRET: ci-session-secret-not-for-production-use-0000
          ENCRYPTION_KEY: ci-encryption-key-not-for-production-use-000000

      # Migration 007 adds the four columns to a table that already exists.
      # The migrator suite runs up to latest and back down to zero, which is the
      # only place the alter is actually executed — a fresh database would not
      # show a missing ALTER on an existing one.
      - name: Migration tests
        run: npx jest lib/__tests__/migrator.test.ts
        env:
          SESSION_SECRET: ci-session-secret-not-for-production-use-0000
          ENCRYPTION_KEY: ci-encryption-key-not-for-production-use-000000

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paystack-billing-coverage
          path: coverage/
          retention-days: 7

# NOTE ON SECRETS
# ----------------
# A credential supplied as a job or step `env:` is available to scripts, but
# echoing it — or passing it on a command line — writes it into the build log,
# where it is readable by anyone with repo access and archived with the run
# forever. This workflow sets none, because nothing here calls the PayStack
# API. When a job that does need one is added, read the value inside the script
# (curl -H "Authorization: Bearer $PAYSTACK_SECRET") and never print it.
