name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic, non-secret values for the build. Production secrets are
  # injected per-environment and are never present in CI logs.
  SESSION_SECRET: ci-session-secret-not-for-production-use-0000
  ENCRYPTION_KEY: ci-encryption-key-not-for-production-use-000000
  # Required by the app at request time (`appName()` in app/layout.tsx and the
  # login page). Set here so the CI environment satisfies the same contract a
  # deployment must; the build itself no longer reads it — `force-dynamic`
  # means nothing is prerendered, so `/_not-found` and friends are not
  # generated at build time.
  APP_NAME: CI Network Monitor

jobs:
  quality:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          DB_CLIENT: sqlite
          # Production boot requires 32+ character secrets; the env block above
          # supplies them so the build exercises the real validation path.

  unit:
    name: Unit tests (SQLite)
    runs-on: ubuntu-latest
    # The test sources are deliberately untracked (see .gitignore): they are
    # not part of the shipped product and must not live in the remote
    # repository. That means CI has nothing to run when the tree carries no
    # test files, so the job skips itself instead of failing on "no tests
    # found". The guard is a file check rather than a hard delete: if someone
    # re-adds a suite, the job wakes up by itself.
    if: ${{ hashFiles('**/*.test.ts') != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test with coverage
        # `npx jest`, not `npm run test:coverage`: the npm script has a
        # post-hook that deletes the coverage output, and the artifact upload
        # below needs that directory to still exist.
        run: npx jest --coverage
        env:
          SESSION_SECRET: ci-session-secret-not-for-production-use-0000
          ENCRYPTION_KEY: ci-encryption-key-not-for-production-use-000000

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sqlite
          path: coverage/
          retention-days: 7

  database:
    name: Unit tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    # Same guard as the unit job above: no test sources in the tree means no
    # suite to run against either engine.
    if: ${{ hashFiles('**/*.test.ts') != '' }}

    # Both engines, neither optional. MariaDB 12.3 is what the local
    # development server runs; MySQL 8.4 is what the deployed container stack
    # runs. Testing only one of them means half of the real deployments are
    # untested, which is precisely how B-14 came to be ticked "both green" while
    # the MySQL leg had never run and could not have.
    #
    # fail-fast is off on purpose: the whole point of two jobs is knowing about
    # both. Cancelling the second on the first failure would reintroduce exactly
    # the blind spot this is meant to close.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: MariaDB 12.3
            image: mariadb:12.3
            # MariaDB ships its own readiness probe, which knows when the server
            # is genuinely up. mysqladmin can pass while initialisation is still
            # running, which makes a service look ready before it is.
            health: 'healthcheck.sh --connect --innodb_initialized'
            admin: 'mariadb'
            # What the server must call itself for this row to be honoured.
            # Carried per row rather than derived from `label` on purpose:
            # "MySQL 8.4" contains the word MySQL, but VERSION() reports
            # "8.4.11" and does not, so matching on the label is exactly the
            # mistake that made this check unable to pass. See
            # scripts/verify-engine.js.
            identify: 'mariadb'
          - label: MySQL 8.4
            image: mysql:8.4
            health: 'mysqladmin ping -h 127.0.0.1 -uroot -pci-root'
            admin: 'mysql'
            identify: 'mysql'

    services:
      db:
        image: ${{ matrix.image }}
        env:
          # Both prefixes are supplied with identical values. The two images read
          # different variable names and there is no way to template a mapping
          # *key* from a matrix value, so each image gets the one it knows and
          # ignores the other. MariaDB's image treats MARIADB_* as
          # authoritative; the MySQL image simply never reads them.
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: home_monitor_test
          MARIADB_USER: monitor
          MARIADB_PASSWORD: ci-monitor
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: home_monitor_test
          MYSQL_USER: monitor
          MYSQL_PASSWORD: ci-monitor
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Report which engine actually answered, so a green run cannot be
      # mistaken for the wrong server. This is the check that would have caught
      # the previous job silently testing something other than what it claimed.
      - name: Confirm the engine under test
        # A green run attributed to the wrong engine is worse than no run.
        # The rule, and the bug this replaces, are documented in the script.
        run: node scripts/verify-engine.js ${{ matrix.identify }}
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: home_monitor_test
          DB_USER: monitor
          DB_PASSWORD: ci-monitor

      # PRD §7 requires the suite to be green against a real MySQL-family
      # database, not only SQLite.
      #
      # --runInBand is not an optimisation choice, it is required. The repository
      # tests share one database, and every suite truncates the tables in its
      # beforeEach. Against SQLite each worker gets a private :memory: database
      # so parallel workers cannot collide. A server database has no such
      # isolation: with parallel workers one suite's truncate wipes another's
      # fixtures mid-test. That produced wildly varying failure counts, 13 to
      # 39, on identical code.
      - name: Test against ${{ matrix.label }}
        run: npx jest --runInBand
        env:
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: home_monitor_test
          DB_USER: monitor
          DB_PASSWORD: ci-monitor
          RUN_MYSQL_TESTS: '1'
          SESSION_SECRET: ci-session-secret-not-for-production-use-0000
          ENCRYPTION_KEY: ci-encryption-key-not-for-production-use-000000
  performance-sqlite:
    name: Performance (PRD §5) — sqlite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the performance dataset
        # 100 devices, 30 days of history at 15-minute resolution — the load
        # the PRD §5 targets are written against.
        run: npm run perf:dataset
        env:
          DB_CLIENT: sqlite
          DB_FILE: ./data/perf.db
          SESSION_SECRET: perf-session-secret-not-for-production-000000
          ENCRYPTION_KEY: perf-encryption-key-not-for-production-00000000

      # Exits non-zero if any p95 misses its target, so a regression in query
      # cost blocks a merge instead of quietly eroding the numbers in the report.
      - name: Measure against the PRD §5 targets
        run: npm run perf
        env:
          DB_CLIENT: sqlite
          DB_FILE: ./data/perf.db
          SESSION_SECRET: perf-session-secret-not-for-production-000000
          ENCRYPTION_KEY: perf-encryption-key-not-for-production-00000000

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-sqlite
          path: doc/PERFORMANCE.sqlite.md
          retention-days: 7

  # The server engines are a separate job rather than extra rows in the
  # SQLite job's matrix. A service container cannot be made conditional per
  # matrix entry — `services.*` has no `if` key, and an entry with an empty
  # image is rejected at workflow-validation time rather than skipped — so a
  # single matrix across all three engines cannot be expressed. One job for the
  # file-backed engine, one for the two servers, no conditional service.
  performance-server:
    name: Performance (PRD §5) — ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false so a miss on one engine still reports the other, and
      # so a green MySQL number can never hide a failed MariaDB one.
      fail-fast: false
      matrix:
        include:
          # `health` and `identify` differ per engine, so both are carried on
          # the row. The health command is the same set the test job uses:
          # MariaDB ships its own readiness probe, and using `mysqladmin` for it
          # was what made this job's container fail to initialise.
          - label: mariadb
            image: mariadb:12.3
            health: 'healthcheck.sh --connect --innodb_initialized'
            identify: 'mariadb'
          - label: mysql
            image: mysql:8.4
            health: 'mysqladmin ping -h 127.0.0.1 -uroot -pperf-root'
            identify: 'mysql'

    services:
      db:
        image: ${{ matrix.image }}
        env:
          # Both images read the MYSQL_* variables; MariaDB also accepts
          # MARIADB_* and prefers it, so both spellings are supplied.
          MARIADB_ROOT_PASSWORD: perf-root
          MARIADB_DATABASE: home_monitor_perf
          MARIADB_USER: monitor
          MARIADB_PASSWORD: perf-monitor
          MYSQL_ROOT_PASSWORD: perf-root
          MYSQL_DATABASE: home_monitor_perf
          MYSQL_USER: monitor
          MYSQL_PASSWORD: perf-monitor
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Confirm the engine under test
        # Same script as the test job, and for the same reason: a green
        # benchmark attributed to the wrong engine is worse than no benchmark.
        run: node scripts/verify-engine.js ${{ matrix.identify }}
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: monitor
          DB_PASSWORD: perf-monitor
          DB_NAME: home_monitor_perf

      - name: Build the performance dataset
        run: npm run perf:dataset
        env:
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          # The dataset builder refuses a schema name that does not look like a
          # throwaway, so a benchmark can never overwrite the live database.
          DB_NAME: home_monitor_perf
          DB_USER: monitor
          DB_PASSWORD: perf-monitor
          SESSION_SECRET: perf-session-secret-not-for-production-000000
          ENCRYPTION_KEY: perf-encryption-key-not-for-production-00000000

      - name: Measure against the PRD §5 targets
        run: npm run perf
        env:
          DB_CLIENT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: home_monitor_perf
          DB_USER: monitor
          DB_PASSWORD: perf-monitor
          SESSION_SECRET: perf-session-secret-not-for-production-000000
          ENCRYPTION_KEY: perf-encryption-key-not-for-production-00000000

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # One artifact per engine, and the path is the engine slug rather than
          # the dialect: DB_CLIENT=mysql drives both MariaDB and MySQL, so a
          # dialect-keyed path would have the second matrix entry overwrite the
          # first.
          name: performance-report-${{ matrix.label }}
          path: doc/PERFORMANCE.${{ matrix.label }}.md
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # The Playwright specs are untracked with the rest of the test sources, so
    # the spec run below is guarded. The job itself still runs: the FCP
    # measurement in it is a perf harness (scripts/fcp.ts), not a test file,
    # and PRD §5 requires it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Playwright's webServer runs `npm run start`, which is `next start` and
      # requires a production build in .next/. Without this step the job dies
      # with "Could not find a production build" before a single spec runs.
      # Locally this was invisible because the build already existed in the
      # working tree, which is why the E2E suite was believed to be wired up.
      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: e2e-session-secret-not-for-production-000000
          ENCRYPTION_KEY: e2e-encryption-key-not-for-production-0000000000

      # PRD §5: "dashboard first contentful paint under 2s on a warm cache". FCP
      # is a browser paint event, so nothing server-side can measure it — which
      # is why `scripts/perf.ts` explicitly disclaimed it and the target sat
      # unevidenced. It reuses this job's browser install and the build above
      # rather than adding a job that would repeat both.
      - name: Measure first contentful paint (PRD §5)
        run: npm run perf:fcp
        env:
          DB_CLIENT: sqlite
          DB_FILE: ./data/fcp.db
          SESSION_SECRET: fcp-session-secret-not-for-production-000000
          ENCRYPTION_KEY: fcp-encryption-key-not-for-production-00000000

      - name: Upload the FCP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcp-report
          path: doc/FCP.md
          retention-days: 7

      - name: Run E2E
        # No specs in the tree means there is nothing to run — the step is
        # skipped rather than failed, because the absence of the sources is the
        # intended state, not a regression.
        if: ${{ hashFiles('**/*.spec.ts') != '' }}
        run: npm run test:e2e
        env:
          CI: 'true'
          SESSION_SECRET: e2e-session-secret-not-for-production-000000
          ENCRYPTION_KEY: e2e-encryption-key-not-for-production-0000000000

      - name: Upload Playwright report
        if: always() && hashFiles('**/*.spec.ts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
