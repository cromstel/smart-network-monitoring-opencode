# Dependabot configuration for smart-network-monitoring-opencode
#
# Monitors npm dependencies for security vulnerabilities and new versions,
# then opens pull requests to keep the dependency tree current.
#
# Security updates are checked daily; version updates weekly.
# Patch and minor bumps are auto-merged when CI passes; major bumps require
# manual review because this is a network-facing service with a scanner backend
# that can be sensitive to dependency behavior changes.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm dependencies — production and development
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    automerge:
      - dependency-type: "direct"
        update-type: "patch"
      - dependency-type: "direct"
        update-type: "minor"
    # Major bumps require review — a scanner backend and MySQL driver are in
    # play here, so breaking changes should be reviewed before merge.
    version-update-strategy: "auto"
    ignore:
      # deepmerge 4.3.1 is the newest published release and still carries a
      # prototype-pollution advisory. It reaches this project only through
      # jest's devDependencies: it is in no shipped artifact and no runtime
      # path, so the exposure is a developer machine's test process.
      #
      # No `update-types` filter is applied on purpose. A fixed release does
      # not exist, so *every* attempt fails identically — including the
      # security update, which is the "Dependabot can't find a published or
      # compatible non-vulnerable version" failure that keeps re-running.
      # Remove this entry if deepmerge ever publishes a fix.
      - dependency-name: "deepmerge"

  # ---------------------------------------------------------------------------
  # GitHub Actions workflows
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    automerge:
      - dependency-type: "action"
        update-type: "patch"
      - dependency-type: "action"
        update-type: "minor"

  # ---------------------------------------------------------------------------
  # Docker — MariaDB image used by docker-compose for local development
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    automerge:
      - dependency-type: "docker"
        update-type: "patch"
